const DEF_CC='971'; // default country code used when a number is saved as 05xxxxxxxx
function waNum(raw){let n=String(raw||'').trim(),plus=n.startsWith('+');n=n.replace(/\D/g,'');if(!n)return '';
 if(!plus){if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n=DEF_CC+n.slice(1)}return n}

function vLog(){const px=teamMode();
 V(`<div class="card"><div class="row">
 <div><label>Date</label><input type="date" id="d" value="${today()}" onchange="$('w').value='WK-'+wkOf(this.value);saved()"></div>
 <div><label>Week (auto)</label><input id="w" readonly value="WK-${wkOf(today())}"></div>
 ${px?`<div style="grid-column:1/-1"><label>${isAdmin()?'Team members':'Your team'} (tick everyone who worked at this site)</label><input id="tq" placeholder="Search name or ID…" oninput="tf()"><div id="tm" class="tm">${teamLabels([me.staff_id])}</div><button class="s" onclick="tAll(true)">Select all</button> <button class="s" onclick="tAll(false)">Clear</button></div>`:`<div><label>Employee</label><input id="st" readonly value="${esc(me.staff_id||'')}"></div>`}</div>${canProxy()?addEmpForm():''}<br>
 <div class="row"><div><label>Project / site</label><input id="pr" list="pl" onchange="pc()"><datalist id="pl">${projs.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div>
 <div><label>Project code</label><input id="pcd" list="pcl" oninput="pcc()" autocomplete="off"><datalist id="pcl">${projs.filter(p=>p.code).map(p=>`<option value="${esc(p.code)}">${esc(p.name)}</option>`).join('')}</datalist></div><div><label>Time in</label><input type="time" id="ti" value="07:00"></div>

function pc(){const p=projs.find(x=>x.name===$('pr').value);if(p)$('pcd').value=p.code||''}
function pcc(){const c=$('pcd').value.trim().toLowerCase();if(!c)return;const p=projs.find(x=>(x.code||'').toLowerCase()===c);if(p)$('pr').value=p.name}
function refreshProjLists(){const a=$('pl'),b=$('pcl');if(a)a.innerHTML=projs.map(p=>`<option value="${esc(p.name)}">`).join('');if(b)b.innerHTML=projs.filter(p=>p.code).map(p=>`<option value="${esc(p.code)}">${esc(p.name)}</option>`).join('')}
async function saveNewProjects(rows){const seen=new Set();let ch=false;
 for(const r of rows){const n=(r.project||'').trim(),c=(r.code||'').trim(),k=n.toLowerCase();if(!n||seen.has(k))continue;seen.add(k);
  const ex=projs.find(p=>p.name.toLowerCase()===k);if(ex&&(ex.code||!c))continue;
  const{error}=await sb.rpc('save_project',{p_name:n,p_code:c||null});if(error){console.warn('save_project',error.message);continue}ch=true}
 if(ch){const j=await sb.from('projects').select('*').order('name');if(j.data)projs=j.data;refreshProjLists()}}

async function addEmpManual(){const i=$('ne_i').value.trim(),n=$('ne_n').value.trim(),m=$('ne_m');m.className='msg';
 if(!i||!n)return m.textContent='Type the employee number and the name.';

function sel(){const t=$('tm');return t?[...t.querySelectorAll('input:checked')].map(i=>i.value):($('st')&&$('st').value?[$('st').value]:[])}

async function clash(rows){if(!rows.length)return[];const ids=[...new Set(rows.map(r=>r.staff_id))],ds=[...new Set(rows.map(r=>r.work_date))];
 const{data,error}=await sb.from('attendance').select('id,staff_id,name,work_date,time_in,time_out,entered_by_name').in('staff_id',ids).in('work_date',ds);
 if(error||!data)return['(could not check existing entries: '+(error?error.message:'no data')+')'];
 const out=[];rows.forEach(r=>{const x=data.find(y=>y.id!==r.rid&&y.staff_id===r.staff_id&&y.work_date===r.work_date&&mins(r.time_in)<mins(y.time_out.slice(0,5))&&mins(r.time_out)>mins(y.time_in.slice(0,5)));
  if(x)out.push(r.name+' on '+r.work_date+' ('+x.time_in.slice(0,5)+'-'+x.time_out.slice(0,5)+', entered by '+(x.entered_by_name||'another user')+')')});return out}
async function addRow(){$('m').className='msg';const ids=sel(),d=$('d').value,ti=$('ti').value,to=$('to').value,b=+$('br').value||0;

 if(!d||!$('pr').value.trim()||!ti||!to)return $('m').textContent='Fill date, project, time in and time out.';
 if(mins(to)<=mins(ti))return $('m').textContent='Time out must be after time in.';
 const bad=[],rows=[];
 ids.forEach(st=>{const e=emps.find(x=>x.staff_id===st);

 V(`<div class="card">${isAdmin()?'':`<p class="pn">You can export attendance for ${pool.length} employee(s) chosen by the admin.</p>`}<div class="row"><div><label>Period</label><select id="xp" onchange="xpc()"><option value="all">All records</option><option value="range">Start – end date</option><option value="week">Weekly</option><option value="day">Particular day</option></select></div>
 <div id="xa" style="display:none"><label>Start date</label><input type="date" id="xfd" value="${m0}"></div><div id="xb" style="display:none"><label>End date</label><input type="date" id="xtd" value="${today()}"></div>
 <div id="xd" style="display:none"><label>Date</label><input type="date" id="xdt" value="${today()}"></div>
 <div><label>Employee</label><select id="xe"><option value="">${isAdmin()?'All employees':'All my employees'}</option>${pool.map(e=>`<option value="${esc(e.staff_id)}">${esc(e.name)}</option>`).join('')}</select></div></div><br>
 <button class="p" onclick="doExp('xls')">⬇️ Excel</button> <button class="p" onclick="doExp('pdf')">📄 PDF</button><p class="msg" id="xm"></p></div>`)}
function xpc(){const v=xp.value;xa.style.display=xb.style.display=v==='range'?'block':'none';xd.style.display=(v==='week'||v==='day')?'block':'none'}
async function doExp(kind){const p=xp.value,d=xdt.value,pool=expEmps(),ids=pool.map(e=>e.staff_id),adm=isAdmin();xm.textContent='';
 if(!adm&&!ids.length)return xm.textContent='No employees have been assigned to you.';
 if(!adm&&xe.value&&!ids.includes(xe.value))return xm.textContent='Not allowed for this employee.';
 let q=sb.from('attendance').select('*').order('work_date').order('name').limit(10000),tag='All';
 if(p==='range'){const a=xfd.value,b=xtd.value;if(!a||!b)return xm.textContent='Pick both the start and end date.';if(a>b)return xm.textContent='The start date must not be after the end date.';q=q.gte('work_date',a).lte('work_date',b);tag=a+'_to_'+b}
 if(p==='week'){q=q.gte('work_date',mon(d)).lte('work_date',add(mon(d),6));tag='WK'+wkOf(mon(d))}
 if(p==='day'){q=q.eq('work_date',d);tag=d}
 if(xe.value)q=q.eq('staff_id',xe.value);else if(!adm)q=q.in('staff_id',ids);
 const{data,error}=await q;if(error)return xm.textContent=error.message;if(!data.length)return xm.textContent='No records match.';
 const f=s=>s.split('-').reverse().join('.'),fn='Attendance_'+tag;
 if(kind==='pdf'){const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  doc.setFontSize(15);doc.text('Attendance Report',14,14);doc.setFontSize(9);doc.text('Period: '+tag.replace('_to_',' to ')+'     Created by Engg Khalid     Generated: '+new Date().toLocaleString(),14,20);
  doc.autoTable({startY:25,head:[['WK#','Date','Name','Staff ID','Project Name','Project Code','Time In','Time Out','Total Hours','Break Period','Task','Entered By','Submitted Late']],body:data.map(r=>['WK-'+r.wk,f(r.work_date),r.name,r.staff_id,r.project||'',r.code||'',r.time_in.slice(0,5),r.time_out.slice(0,5),r.hours,r.break_min,r.task||'',r.entered_by_name||'',lateOf(r)?'Yes':'']),theme:'grid',styles:{fontSize:7,cellPadding:1.5,overflow:'linebreak',valign:'middle'},headStyles:{fillColor:[138,43,226],halign:'center'},margin:{left:8,right:8},
   columnStyles:{0:{cellWidth:13,halign:'center'},1:{cellWidth:19},2:{cellWidth:34},3:{cellWidth:19},4:{cellWidth:34},5:{cellWidth:17},6:{cellWidth:13,halign:'center'},7:{cellWidth:13,halign:'center'},8:{cellWidth:13,halign:'center'},9:{cellWidth:13,halign:'center'},11:{cellWidth:27},12:{cellWidth:13,halign:'center'}}});
  doc.save(fn+'.pdf')}
 else{const rows=data.map(r=>({'WK#':'WK-'+r.wk,Date:f(r.work_date),Name:r.name,'Staff ID':r.staff_id,'Project Name':r.project,'Project Code':r.code,'Time In':r.time_in.slice(0,5),'Time Out':r.time_out.slice(0,5),'Total Hours':r.hours,'Break Period':r.break_min,Task:r.task,'Entered By':r.entered_by_name,'Submitted Late':lateOf(r)?'Yes':''}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Attendance');XLSX.writeFile(wb,fn+'.xlsx')}
 xm.textContent=data.length+' records exported.'}

/* ---- Audit log ---- */
async function vAud(){const{data}=await sb.from('audit_logs').select('*').order('at',{ascending:false}).limit(300);
 V(`<div class="card"><div class="t"><table><tr><th>When</th><th>User</th><th>Action</th><th>Target</th></tr>${(data||[]).map(r=>`<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.actor_name)}</td><td>${esc(r.action)}</td><td>${esc(r.target)}</td></tr>`).join('')}</table></div></div>`)}

sb.auth.getSession().then(({data})=>{if(data.session)boot(false)});
</script></body></html>
